[workspace]
resolver = "2"
members = [
    "facade",
    "crates/fdx/contracts",
    "crates/ledger/contracts",
    "crates/payments/contracts",
    "crates/regulatory/contracts",
]

[workspace.package]
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Bank8-dev/bank8-sdk"
rust-version = "1.85"

[workspace.dependencies]
# full platform dep table (mirrors sentin8-sdk) + intra-vertical
# contracts path deps. Platform sentin8-* crates arrive via the
# sentin8 facade git pin — never as local paths (RS §2.3).
axum = { version = "0.8", features = ["macros"] }
hyper = { version = "1", features = ["full"] }
tokio = { version = "1", features = ["full"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.7", features = ["trace", "cors", "compression-gzip", "limit"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls-native-roots-no-provider", "stream"], default-features = false }
tokio-stream = "0.1"
bytes = "1"
tokio-tungstenite = { version = "0.30", features = ["connect", "rustls-tls-native-roots"], default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-futures = "0.2"
once_cell = "1"
sqlx = { version = "0.8", features = ["runtime-tokio", "tls-rustls-ring", "postgres", "uuid", "chrono", "json", "macros", "rust_decimal"] }
time = "0.3.36"
jsonwebtoken = "9"
rand = "0.8"
sha2 = "0.10"
hmac = "0.12"
sha1 = "0.10"
p256 = { version = "0.13", features = ["ecdsa", "ecdsa-core", "pem"] }
ciborium = "0.2"
aes-gcm = "0.10"
zeroize = "1"
ring = "0.17"
rsa = { version = "0.9", features = ["sha2"] }
bcrypt = "0.15"
async-trait = "0.1"
futures-util = "0.3"
uuid = { version = "1", features = ["v4", "v5", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
ulid = { version = "1", features = ["serde"] }
base64 = "0.22"
rust_decimal = { version = "1", features = ["serde-with-str", "db-postgres"] }
figment = { version = "0.10", features = ["env", "toml"] }
dotenvy = "0.15"
prometheus = "0.13"
opentelemetry = "0.27"
validator = { version = "0.18", features = ["derive"] }
sentin8 = { git = "https://github.com/Sentin8/sentin8-sdk", tag = "sdk-v0.6.5" }
utoipa = { version = "5", features = ["chrono", "uuid", "decimal"] }
bank8-ledger-contracts = { path = "crates/ledger/contracts" }
bank8-payments-contracts = { path = "crates/payments/contracts" }
bank8-fdx-contracts = { path = "crates/fdx/contracts" }
bank8-regulatory-contracts = { path = "crates/regulatory/contracts" }
